
name: Deploy ASP.NET to Somee

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  deploy:
    runs-on: windows-latest

    steps:
      # 1. Lấy source code
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. Cài đặt .NET 8
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # 3. Build và Publish project
      - name: Publish ASP.NET
        run: dotnet publish aspNet/aspNet.csproj -c Release -o ./publish --self-contained false

      # 4. Deploy lên Somee bằng FTP
      - name: Deploy to Somee
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          local-dir: ./publish/
          exclude: |
            **/.git*
            **/.github/**
